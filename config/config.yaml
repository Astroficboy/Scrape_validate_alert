# Job Alert System configuration
# Tune this file instead of touching code. Secrets (API keys, phone numbers,
# SMTP creds) live in environment variables / GitHub Actions secrets — see
# .env.example — not here, except for the two non-secret contact fields below
# which the candidate asked to be sent to directly.

candidate:
  name: "Pranav Wankhedkar"
  # Used only as a fallback if EMAIL_TO / TWILIO_WHATSAPP_TO env vars are unset.
  email_to: "pranavwankhedkar@gmail.com"
  whatsapp_to: "+918087595673"
  available_from: "2026-10-25"   # "late Oct / early Nov" per candidate
  target_monthly_salary_aed: 45000
  # Drives the "years required" scoring component below.
  ai_years: 5        # hands-on AI/ML/GenAI (per CV)
  total_years: 9      # broader technology/analytics/business experience
  max_years_tolerated: 12   # postings asking beyond this get penalised, not excluded

search:
  # Free-text queries sent to structured job-search sources (Adzuna etc.)
  queries:
    - "AI Engineering Lead"
    - "Lead AI Engineer"
    - "Principal AI Engineer"
    - "AI Solutions Architect"
    - "GenAI Lead"
    - "Senior AI Engineer"
    - "Senior Machine Learning Engineer"
    - "Applied AI Lead"
    - "Head of AI"
    - "MLOps Lead"
  locations:
    # Order matters only for display; Dubai gets an extra score bonus below.
    - "Dubai"
    - "United Arab Emirates"
    - "Abu Dhabi"
    - "Sharjah"
  primary_location: "Dubai"

filters:
  # A job title must contain at least one of these to be considered senior enough.
  seniority_keywords:
    - "lead"
    - "senior"
    - "sr."
    - "sr "
    - "principal"
    - "staff"
    - "head of"
    - "architect"
    - "director"
    - "chief"
    - "manager"

  # A job must be AI/ML/engineering-related — title or description must hit one of these.
  domain_keywords:
    - "ai"
    - "artificial intelligence"
    - "machine learning"
    - " ml "
    - "genai"
    - "generative ai"
    - "llm"
    - "large language model"
    - "nlp"
    - "natural language processing"
    - "data scien"
    - "deep learning"
    - "mlops"
    - "agentic"
    - "software engineer"
    - "backend engineer"
    - "platform engineer"
    - "engineering"

  # Any hit here excludes the job outright, regardless of other matches.
  exclude_keywords:
    - "intern"
    - "internship"
    - "junior"
    - "trainee"
    - "graduate program"
    - "fresher"
    - "entry level"
    - "entry-level"
    - "part-time"
    - "part time"

  # Resume skill keywords used for match-scoring (weighted). Higher weight = more
  # central to the candidate's actual experience (see uploaded CV).
  skill_weights:
    "agentic ai": 10
    "generative ai": 9
    "genai": 9
    "rag": 8
    "retrieval augmented generation": 8
    "llm": 9
    "large language model": 9
    "langchain": 7
    "prompt engineering": 6
    "gemini": 5
    "openai": 6
    "python": 8
    "pytorch": 6
    "tensorflow": 6
    "scikit-learn": 4
    "xgboost": 4
    "mlops": 7
    "machine learning": 8
    "nlp": 6
    "gcp": 6
    "google cloud": 6
    "aws": 5
    "databricks": 6
    "airflow": 4
    "fastapi": 4
    "docker": 4
    "etl": 5
    "data pipeline": 5
    "semantic search": 5
    "hugging face": 5

  # 0-100 composite score threshold required to trigger an alert.
  min_score_to_alert: 40

salary:
  target_currency: "AED"
  min_monthly: 45000
  # A disclosed salary below this fraction of the target excludes the job
  # (a 10% margin avoids dropping near-misses worth negotiating).
  tolerance_ratio: 0.9
  # Static approximate FX rates to AED, for normalizing salaries posted in
  # other currencies. AED is USD-pegged (3.6725); others are approximate and
  # should be refreshed periodically — see README.
  fx_to_aed:
    AED: 1.0
    USD: 3.6725
    SAR: 0.9793
    QAR: 1.0089
    OMR: 9.5485
    BHD: 9.7407
    KWD: 11.97
    EUR: 3.97
    GBP: 4.63
    INR: 0.0442

sources:
  email_alerts:
    enabled: true
    # The most reliable route to LinkedIn/Indeed/Naukrigulf/GulfTalent/Bayt:
    # instead of scraping (ToS risk, bot detection), create a DAILY email
    # alert for each target title on each board, scoped to Dubai/UAE, all
    # delivered to one dedicated inbox — this reads that inbox over IMAP.
    # No scraping, no account risk. See README for the one-time setup.
    imap_host: "imap.gmail.com"
    mailbox: "INBOX"
    lookback_hours: 26
    mark_as_read: true
    # Sender domain -> board display name. Add senders as you set up more alerts.
    senders:
      "linkedin.com": "LinkedIn"
      "indeed.com": "Indeed"
      "naukrigulf.com": "Naukri Gulf"
      "gulftalent.com": "GulfTalent"
      "bayt.com": "Bayt"
      "monstergulf.com": "Monster Gulf"
      "glassdoor.com": "Glassdoor"
  adzuna:
    # Disabled: confirmed via a live run that Adzuna's API returns 404 for
    # country code "ae" — the UAE is not one of Adzuna's covered markets, so
    # this source can never return Dubai/UAE results regardless of
    # credentials. Left wired up in code in case Adzuna adds MENA coverage.
    enabled: false
    country: "ae"
    results_per_query: 25
  greenhouse:
    enabled: true
    # boards-api.greenhouse.io/v1/boards/<token>/jobs — token comes from the
    # company's careers page URL (boards.greenhouse.io/<token>). Every token
    # below was confirmed live by scripts/check_boards.py (Sept 2026); the
    # UAE counts are from that sweep and will drift, so re-run it
    # periodically — companies migrate ATS and boards go quiet.
    companies:
      # Currently listing UAE roles:
      - bybit        # 160 jobs, 61 UAE
      - careem       # 21 jobs, 11 UAE
      - okx          # 343 jobs, 9 UAE
      - datacamp     # 34 jobs, 8 UAE
      - binance      # 10 jobs, 2 UAE
      - scaleai      # 228 jobs, 2 UAE
      - databricks   # 892 jobs, 1 UAE
      # Board is live but had no UAE roles during the sweep. Each costs one
      # request/day and the location gate drops non-UAE rows anyway, so the
      # only cost of keeping them is that request — worth it for employers
      # that plausibly open a Dubai role.
      - anthropic    # 596 jobs
      - thoughtworks # 45 jobs
      - bitpanda     # 24 jobs
      - turing       # 19 jobs
  lever:
    enabled: true
    # api.lever.co/v0/postings/<slug> — slug comes from jobs.lever.co/<slug>.
    # Confirmed live by scripts/check_boards.py (Sept 2026). Note Binance
    # runs both a Lever and a Greenhouse board with different postings, so
    # both are listed; canonical_url() dedupes anything that overlaps.
    companies:
      - binance      # 292 jobs, 11 UAE
      - palantir     # 314 jobs, 4 UAE
  workday:
    enabled: true
    # Workday's public CXS JSON endpoint. Every tenant below was confirmed
    # answering by scripts/check_boards.py's sibling scripts/probe_workday.py
    # — tenant, shard and site slug are three independent unknowns, so these
    # are observed values. Add new ones by re-running that probe, never by
    # guessing.
    #
    # Honest expectations: a 124-tenant sweep (19 Sep 2026) found only these
    # four with UAE openings, and that day's postings were sales/marketing
    # rather than engineering. No Gulf employer (ADNOC, Emaar, Aldar, Majid
    # Al Futtaim, Emirates NBD, DP World, Etihad) runs a reachable Workday
    # tenant at all. This is a small, cheap addition — roughly 20 requests a
    # day — not a fix for AI-role coverage.
    results_per_query: 20
    # Falls back to search.queries when unset; kept short since every term
    # costs one request per tenant.
    search_terms:
      - "artificial intelligence"
      - "machine learning"
      - "data scientist"
      - "software engineer"
      - "AI engineer"
    tenants:
      - {tenant: "visa",        shard: "wd5", site: "visa",               company: "Visa"}
      - {tenant: "thales",      shard: "wd3", site: "careers",            company: "Thales"}
      - {tenant: "crowdstrike", shard: "wd5", site: "CrowdstrikeCareers", company: "CrowdStrike"}
      - {tenant: "maersk",      shard: "wd3", site: "Maersk_Careers",     company: "Maersk"}
      # API answers but showed no UAE rows in the sweep; kept because each
      # costs only its own requests and the location filter drops non-UAE.
      - {tenant: "redhat",      shard: "wd5", site: "Jobs",               company: "Red Hat"}
      - {tenant: "paypal",      shard: "wd1", site: "Jobs",               company: "PayPal"}
  dubai_careers:
    enabled: true
    # Government of Dubai's Oracle Taleo portal (jobs.dubaicareers.ae).
    # Covers the government entities — RTA, Dubai Municipality, DEWA, Dubai
    # Police, Smart Dubai and the rest — which run no public ATS board and
    # are otherwise unreachable now that Google search is off.
    #
    # The page returns roughly the 25 most recent postings, which is the
    # right window for a daily run; dedup handles repeats across days.
    # Leave search_url unset to use the default listing, or paste a filtered
    # Dubai Careers search URL here to narrow it.
    search_url: ""
  bayt:
    enabled: true
    # Best-effort HTML scraper — Bayt's markup can change without notice,
    # AND cloud/datacenter IPs (like GitHub Actions runners) get 403'd by
    # its anti-bot layer more often than not. Treat as opportunistic, not
    # reliable.
    search_url: "https://www.bayt.com/en/uae/jobs/"
  # Google Custom Search JSON API (https://developer.google.com/custom-search/v1)
  # — free tier is 100 queries/day, shared here across google_discovery
  # (broad title search) and google_watch (priority-company search) below.
  # Discovery spends first; watch gets whatever's left, so adding title
  # terms degrades gracefully by watching fewer companies rather than
  # erroring. Needs GOOGLE_API_KEY + GOOGLE_CSE_ID env vars (see
  # .env.example); both sub-sources are silently disabled without them.
  google_search:
    max_daily_queries: 90
  google_discovery:
    # DISABLED Sept 2026. Every query returns HTTP 403 "This project does not
    # have the access to Custom Search JSON API", verified directly against
    # the endpoint (not just from CI) with a valid 39-char key belonging to
    # the same Cloud project whose console shows that API enabled, and after
    # the enablement propagation window. The refusal is project-state on
    # Google's side — most likely billing/free-trial standing — not anything
    # this repo controls. Left wired up rather than deleted: flip both Google
    # sources back to true once the project is in good standing (or a fresh
    # project is used) and they resume with no code change.
    enabled: false
    # Broad discovery: (title from search.queries) x (suffix) per query,
    # so this also catches roles at companies outside priority_targets
    # entirely — careers pages, ATS boards, Workday postings that never
    # reach aggregators.
    date_restrict: "d3"
    results_per_query: 10
    suffixes:
      - "Dubai UAE"
      - "Dubai jobs site:boards.greenhouse.io OR site:jobs.lever.co"
      - "UAE site:*.workday.com OR site:*.myworkdayjobs.com"
      - "site:builtin.com OR site:jobs.techstars.com Dubai"
  google_watch:
    # DISABLED Sept 2026 — same 403 as google_discovery above; see that note.
    enabled: false
    # Each `watch: true` company in priority_targets below costs exactly one
    # query per run (fallback budget if google_discovery is disabled/fails
    # to report spend — normally main.py computes the real remainder).
    daily_query_budget: 35
    results_per_query: 10

digest:
  max_jobs_whatsapp: 10
  max_jobs_email: 30
  notify_email_on_empty: true
  notify_whatsapp_on_empty: false
  notify_on_source_failure: true

# ---------------------------------------------------------------------------
# PRIORITY TARGETS — drives both the Google-watch search queries (sources.
# google_watch above) and score bonuses in the validator.
#
# Each tier's `bonus` is added to a job's match score, so an equivalent role
# at Emirates NBD outranks one at an unknown integrator. Companies match by
# the `name` in the job's company field and by `domain` in the job URL —
# never the description, since AWS/Databricks/Oracle appear constantly as
# required skills and would wrongly tag half the feed as big tech.
#
# `watch: true` spends one Google query per run on that company. Both Google
# sources are currently disabled (see sources.google_discovery), so these
# flags are inert right now — they are kept so the watch list is ready the
# moment Google is switched back on. Score bonuses are unaffected and still
# apply to every job from every source.
# ---------------------------------------------------------------------------
priority_targets:

  # ---------------------------------------------------------------- TIER 1
  # Pay 45k+. Dubai-based, enterprise AI, agentic workflows on the roadmap.
  banks:
    bonus: 14
    note: "Highest average GenAI pay of any UAE sector (~AED 53k/month)"
    companies:
      - {name: "Emirates NBD",              domain: "emiratesnbd.com",    watch: true}
      - {name: "First Abu Dhabi Bank",      domain: "bankfab.com",        watch: true}
      - {name: "FAB",                       domain: "bankfab.com",        watch: false}
      - {name: "Mashreq",                   domain: "mashreqbank.com",    watch: true}
      - {name: "ADCB",                      domain: "adcb.com",           watch: true}
      - {name: "Abu Dhabi Commercial Bank", domain: "adcb.com",           watch: false}
      - {name: "Dubai Islamic Bank",        domain: "dib.ae",             watch: false}
      - {name: "Emirates Islamic",          domain: "emiratesislamic.ae", watch: false}

  # Sovereign AI cluster. Pays 15-30% above market. ABU DHABI — commute matters.
  sovereign_ai:
    bonus: 13
    note: "G42 median SWE total comp AED 434K, tops out near AED 700K"
    companies:
      - {name: "G42",       domain: "g42.ai",       watch: true}
      - {name: "Core42",    domain: "core42.ai",    watch: true}
      - {name: "Presight",  domain: "presight.ai",  watch: true}
      - {name: "Inception", domain: "",             watch: false}
      - {name: "Bayanat",   domain: "bayanat.ai",   watch: false}
      - {name: "AIQ",       domain: "aiq.ae",       watch: false}
      - {name: "M42",       domain: "m42.ae",       watch: false}
      - {name: "Technology Innovation Institute", domain: "tii.ae", watch: false}
      - {name: "Mubadala",  domain: "mubadala.com", watch: false}
      - {name: "ADNOC",     domain: "adnoc.ae",     watch: true}

  # Big tech regional. RSUs push senior total comp to AED 450k-750k.
  big_tech:
    bonus: 13
    note: "Google Cloud MEA is the closest match to your GCP/Gemini stack"
    companies:
      - {name: "Google",              domain: "google.com",     watch: true}
      - {name: "Microsoft",           domain: "microsoft.com",  watch: true}
      - {name: "Amazon Web Services", domain: "amazon.jobs",    watch: true}
      - {name: "AWS",                 domain: "amazon.jobs",    watch: false}
      - {name: "NVIDIA",              domain: "nvidia.com",     watch: false}
      - {name: "Oracle",              domain: "oracle.com",     watch: false}
      - {name: "Databricks",          domain: "databricks.com", watch: false}
      - {name: "Snowflake",           domain: "snowflake.com",  watch: false}
      - {name: "IBM",                 domain: "ibm.com",        watch: false}
      - {name: "SAP",                 domain: "sap.com",        watch: false}
      # Added Sept 2026 after check_boards.py confirmed each runs a live
      # public ATS board (now in sources.greenhouse/lever). watch:false so
      # they cost no Google query — the board scrape already covers them.
      - {name: "Anthropic",           domain: "anthropic.com",  watch: false}
      - {name: "Scale AI",            domain: "scale.com",      watch: false}
      - {name: "Palantir",            domain: "palantir.com",   watch: false}

  # ---------------------------------------------------------------- TIER 2
  product_tech:
    bonus: 7
    note: "Strong engineering cultures; 45k needs a genuinely senior scope"
    companies:
      - {name: "Careem",          domain: "careem.com",        watch: true}
      - {name: "noon",            domain: "noon.com",          watch: true}
      - {name: "Talabat",         domain: "talabat.com",       watch: true}
      - {name: "Property Finder", domain: "propertyfinder.ae", watch: false}
      - {name: "Dubizzle",        domain: "dubizzle.com",      watch: false}
      - {name: "Bayut",           domain: "bayut.com",         watch: false}
      - {name: "Tabby",           domain: "tabby.ai",          watch: false}
      - {name: "Kitopi",          domain: "kitopi.com",        watch: false}
      - {name: "DP World",        domain: "dpworld.com",       watch: true}
      - {name: "Aramex",          domain: "aramex.com",        watch: false}
      - {name: "Emirates Group",  domain: "emiratesgroupcareers.com", watch: true}
      - {name: "Etihad",          domain: "etihad.com",        watch: false}
      - {name: "e&",              domain: "eand.com",          watch: false}
      - {name: "Etisalat",        domain: "etisalat.ae",       watch: false}

  crypto:
    bonus: 4
    note: "Pays well, sector volatility — weigh that yourself"
    companies:
      - {name: "Binance",    domain: "binance.com",  watch: false}
      - {name: "Bybit",      domain: "bybit.com",    watch: false}
      - {name: "OKX",        domain: "okx.com",      watch: false}
      - {name: "Crypto.com", domain: "crypto.com",   watch: false}
      - {name: "Bitpanda",   domain: "bitpanda.com", watch: false}

  # ---------------------------------------------------------------- TIER 3
  # Negative bonus — still surfaced, but pushed down. These rarely clear 45k,
  # and Indian IT services in the UAE tend to benchmark off India comp.
  deprioritised:
    bonus: -25
    note: "Services firms and deputation packages below your target"
    companies:
      - {name: "Wipro",             domain: "wipro.com",        watch: false}
      - {name: "Tata Consultancy",  domain: "tcs.com",          watch: false}
      - {name: "TCS",               domain: "tcs.com",          watch: false}
      - {name: "Infosys",           domain: "infosys.com",      watch: false}
      - {name: "HCLTech",           domain: "hcltech.com",      watch: false}
      - {name: "Tech Mahindra",     domain: "techmahindra.com", watch: false}
      - {name: "Cognizant",         domain: "cognizant.com",    watch: false}
      - {name: "LTIMindtree",       domain: "ltimindtree.com",  watch: false}
      - {name: "Capgemini",         domain: "capgemini.com",    watch: false}
      - {name: "Thoughtworks",      domain: "thoughtworks.com", watch: false}
      - {name: "Turing",            domain: "turing.com",       watch: false}
