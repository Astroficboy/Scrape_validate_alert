name: Daily Dubai AI Job Alert

on:
  schedule:
    # 05:00 UTC = 09:00 Gulf Standard Time (Dubai, UTC+4)
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-job-alert
  cancel-in-progress: false

jobs:
  run-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job alert pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
          TWILIO_CONTENT_SID: ${{ secrets.TWILIO_CONTENT_SID }}
        run: python -m src.main

      - name: Persist dedup state
        run: |
          if ! git diff --quiet -- data/seen_jobs.json; then
            git config user.name "job-alert-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/seen_jobs.json
            git commit -m "chore: update seen-jobs dedup state [skip ci]"
            git push
          else
            echo "No dedup state changes to commit."
          fi
