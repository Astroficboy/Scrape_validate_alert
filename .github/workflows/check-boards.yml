name: Verify Greenhouse/Lever Board Tokens

on:
  workflow_dispatch: {}

jobs:
  check-boards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests PyYAML python-dotenv

      - name: Check board tokens
        run: python scripts/check_boards.py
